[package]
name = "run-fast"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["CunZai1069 <cunzai1069@gmail.com>"]
description = "Start configured programs quickly: a shortcut and alias launcher driven by a TOML file"
license = "MIT"
readme = "README.md"
repository = "https://github.com/CunZaijiali/QH-Runfast"
homepage = "https://github.com/CunZaijiali/QH-Runfast"
documentation = "https://github.com/CunZaijiali/QH-Runfast#readme"
keywords = ["launcher", "alias", "cli", "shortcut", "productivity"]
categories = ["command-line-utilities"]
include = [
    "/src/main.rs",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE",
    "/config.toml",
]

# The package is `run-fast`, the installed command is `runf`.
[[bin]]
name = "runf"
path = "src/main.rs"

[dependencies]
clap = "4.6.7"
toml = "1.1.6"
serde = {version="1.0.229", features=["derive"]}

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = "thin"
debug-assertions = false
codegen-units = 1
panic = 'abort'
incremental = false
overflow-checks = false
